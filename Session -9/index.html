<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="Utf-8">
    <meta name="viewport" content="width-device-width. initial-scale-1.0">
    <title>Document</title>
  <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(2, 100px);
        gap: 10px;
    }
    .header{
        grid-column: 1/6;
        background-color: red;
    }
    .box{
        background-color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Header</div>

    <div class="box">12</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    <div class="box">10</div> 
  </div>
  <h1>Rohit tiwari</h1>
</body>
</html>
